name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e

      - name: No runtime dependencies
        run: node --input-type=module -e "import { execSync } from 'node:child_process'; const out = execSync('npm ls --omit=dev --depth=0 --json', { encoding: 'utf8' }); const data = JSON.parse(out); const deps = data.dependencies ?? {}; if (Object.keys(deps).length > 0) { console.error(deps); process.exit(1); } console.log('no runtime dependencies');"
