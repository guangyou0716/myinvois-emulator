# Weekly update PRs. Nothing merges automatically; each PR goes through CI and review.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 20 until a deliberate major upgrade; digest and patch bumps still come through.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
